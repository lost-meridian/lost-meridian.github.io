<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f6f4" />
  <title>관리자 페이지 · LOST MERIDIAN</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" />
  <style>
    :root {
      --wine: #9D3645; --wine-dark: #852c39; --butter: #F7E7B2; --navy: #0d1026;
      --cream: #f6f6f4; --soft: #efefec; --ink: #1d2033; --sub: #6b6f86; --faint: #a3a6b6; --line: #e6e6e1;
      --sans: Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--cream); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
    button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
    input, textarea { word-break: normal; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
    .mark { width: 28px; height: 28px; flex-shrink: 0; }

    /* 잠금 화면 */
    .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lock-card { background: #fff; border-radius: 22px; padding: 38px 28px 30px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 40px rgba(13,16,38,.06); }
    .lock-card .mark { width: 46px; height: 46px; margin: 0 auto 14px; display: block; }
    .lock-card small { font-size: .72rem; font-weight: 900; letter-spacing: .16em; color: var(--wine); }
    .lock-card h1 { font-size: 1.25rem; font-weight: 900; color: var(--navy); margin-top: 2px; }
    .lock-card p { color: var(--sub); font-size: .88rem; margin: 6px 0 20px; }
    .lock-card input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 14px; outline: none; text-align: center; font-size: 1rem; }
    .lock-card input:focus { border-color: var(--wine); }
    .lock-err { color: var(--wine); font-size: .82rem; font-weight: 700; min-height: 1.3em; margin-top: 8px; }

    /* 공통 */
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 140px; }
    header.top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); }
    .top-inner { max-width: 680px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
    .top-inner h1 { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; }
    .top-inner h1 b { font-size: .98rem; font-weight: 900; color: var(--navy); }
    .top-inner h1 small { font-size: .64rem; font-weight: 800; letter-spacing: .14em; color: var(--wine); }
    .link-btn { font-size: .82rem; color: var(--navy); font-weight: 800; padding: 7px 11px; border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .link-btn:hover { background: var(--soft); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
    .dot.on { background: #3f9b6a; }

    .btn { border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: .88rem; transition: background .15s; white-space: nowrap; }
    .btn-sm { padding: 7px 13px; font-size: .78rem; }
    .btn-main { background: var(--wine); color: #fff; }
    .btn-main:hover { background: var(--wine-dark); }
    .btn-ghost { background: var(--soft); color: var(--navy); }
    .btn-ghost:hover { background: var(--butter); }
    .btn-line { box-shadow: inset 0 0 0 1.5px var(--wine); color: var(--wine); background: #fff; }
    .btn:disabled { opacity: .45; cursor: default; }

    .notice-bar { margin: 16px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--butter); color: var(--navy); font-size: .86rem; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .notice-bar span { flex: 1; min-width: 200px; }

    .tabs { display: flex; margin: 18px 0 14px; background: #fff; border-radius: 14px; padding: 4px; box-shadow: 0 1px 3px rgba(13,16,38,.04); }
    .tab { flex: 1; padding: 10px 0; border-radius: 11px; font-weight: 800; font-size: .9rem; color: var(--sub); }
    .tab.active { background: var(--navy); color: #fff; }
    .tab i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--wine); margin-left: 5px; vertical-align: 2px; }
    .tab.active i { background: var(--butter); }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
    .section-head h2 { font-size: 1.05rem; font-weight: 900; color: var(--navy); }
    .hint { font-size: .8rem; color: var(--sub); }

    /* 목록 */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item { background: #fff; border-radius: 16px; padding: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 1px 3px rgba(13,16,38,.04); cursor: pointer; }
    .thumb { width: 104px; aspect-ratio: 1920 / 780; border-radius: 9px; object-fit: cover; flex-shrink: 0; background: #1a1e3d; color: #ffffffa0; font-size: .62rem; font-weight: 800; letter-spacing: .1em; display: flex; align-items: center; justify-content: center; }
    .num { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--wine); font-weight: 900; font-size: .8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .item-main { flex: 1; min-width: 0; }
    .item-title { font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: .78rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .badge { display: inline-block; font-size: .66rem; font-weight: 800; padding: 1px 7px; border-radius: 6px; background: #e6f4ec; color: #2f8a57; margin-left: 5px; vertical-align: 1px; }
    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--sub); }
    .icon:hover { background: var(--soft); color: var(--navy); }
    .icon.del:hover { background: #fbe9ec; color: var(--wine); }
    .icon svg { width: 17px; height: 17px; }
    .icon:disabled { opacity: .25; cursor: default; background: none; }
    .empty { text-align: center; color: var(--sub); padding: 40px 16px; font-size: .9rem; background: #fff; border-radius: 16px; }
    .tag { flex-shrink: 0; padding: 3px 9px; border-radius: 999px; font-size: .7rem; font-weight: 900; }
    .t0 { background: var(--wine); color: #fff; } .t1 { background: var(--navy); color: #fff; } .t2 { background: var(--butter); color: var(--wine); } .t3 { background: #e9e9ef; color: var(--navy); } .t4 { background: var(--cream); color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }

    /* 편집 창 */
    .overlay { position: fixed; inset: 0; z-index: 30; background: rgba(13,16,38,.38); display: none; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow-y: auto; }
    .overlay.open { display: flex; }
    .editor { background: #fff; width: 100%; max-width: 560px; border-radius: 20px; overflow: hidden; }
    .ed-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 18px; box-shadow: 0 1px 0 var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
    .ed-top h3 { font-size: 1rem; font-weight: 900; color: var(--navy); }
    .ed-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
    .ed-foot { display: flex; gap: 8px; padding: 12px 16px; box-shadow: 0 -1px 0 var(--line); background: #fff; }
    .ed-foot .btn { height: 48px; border-radius: 15px; font-size: .95rem; }
    .ed-foot .btn-ghost { flex: 0 0 96px; }
    .ed-foot .btn-main { flex: 1; }
    label.f, div.f { display: flex; flex-direction: column; gap: 6px; font-size: .84rem; font-weight: 800; color: var(--navy); }
    .f small { font-weight: 500; color: var(--sub); }
    .f input, .f textarea, .f select { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; outline: none; font-weight: 500; background: #fff; font-size: .95rem; }
    .f textarea { min-height: 150px; resize: vertical; line-height: 1.65; }
    .f input:focus, .f textarea:focus, .f select:focus { border-color: var(--wine); }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { padding: 7px 13px; border-radius: 999px; background: var(--soft); font-size: .84rem; font-weight: 800; color: var(--sub); }
    .chips button.on { background: var(--navy); color: #fff; }
    .note { padding: 11px 13px; border-radius: 12px; background: var(--cream); color: var(--sub); font-size: .82rem; }

    .img-box { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--cream); }
    .pv-l { font-size: .7rem; font-weight: 900; letter-spacing: .1em; color: var(--sub); }
    .pv { position: relative; border-radius: 12px; overflow: hidden; background: #1a1e3d; }
    .pv.pc { aspect-ratio: 1920 / 780; }
    .pv.mo { aspect-ratio: 16 / 9; width: 62%; }
    .pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pv .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #ffffffa0; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-align: center; padding: 8px; }
    .pv .ph b { color: #fff; font-size: .95rem; letter-spacing: -.02em; }
    .pv .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: baseline; gap: 8px; padding: 26px 14px 10px; background: linear-gradient(#0000, #00000073); color: #fff; }
    .pv .cap b { font-size: 1.05rem; font-weight: 900; } .pv .cap span { font-size: .78rem; font-weight: 600; opacity: .88; }
    .pv { background: linear-gradient(160deg, #d9d8d4, #c3c2be); }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .file-btn { position: relative; overflow: hidden; display: inline-flex; }
    .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .tiny { font-size: .74rem; color: var(--sub); }
    .tiny.warn { color: var(--wine); font-weight: 700; }
    details.more { border-radius: 14px; background: var(--cream); }
    details.more summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: .86rem; color: var(--navy); }
    details.more summary::-webkit-details-marker { display: none; }
    details.more summary small { margin-left: auto; font-weight: 600; color: var(--sub); font-size: .76rem; }
    details.more summary small::after { content: " ▾"; }
    details.more[open] summary small::after { content: " ▴"; }
    details.more .in { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* 연결 */
    .steps { display: flex; flex-direction: column; gap: 10px; }
    .step { display: flex; gap: 10px; align-items: flex-start; font-size: .86rem; color: var(--ink); }
    .step b { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; font-size: .72rem; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .step em { font-style: normal; font-weight: 800; color: var(--wine); }
    .go-link { display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 14px; background: var(--navy); color: #fff; font-weight: 800; font-size: .9rem; }
    .conn { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-radius: 12px; background: var(--cream); font-size: .84rem; font-weight: 700; color: var(--navy); }

    /* 하단 바 */
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 -1px 0 var(--line); }
    .bottom-inner { max-width: 680px; margin: 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
    .bottom-inner .status { flex: 1; min-width: 0; font-size: .82rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bottom-inner .status b { color: var(--wine); }
    .bottom-inner .btn { height: 44px; padding: 0 20px; }

    /* 확인창 */
    .dlg-back { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(13,16,38,.3); opacity: 0; transition: opacity .18s; }
    .dlg-back.show { opacity: 1; }
    .dlg { width: 100%; max-width: 320px; background: #fff; border-radius: 22px; padding: 24px 20px 16px; text-align: center; transform: scale(.94); transition: transform .2s; }
    .dlg-back.show .dlg { transform: none; }
    .dlg .mark { width: 34px; height: 34px; margin: 0 auto 10px; display: block; }
    .dlg-title { font-size: 1rem; font-weight: 900; color: var(--navy); line-height: 1.4; }
    .dlg-msg { margin-top: 6px; font-size: .84rem; color: var(--sub); line-height: 1.55; }
    .dlg-btns { display: flex; gap: 8px; margin-top: 18px; }
    .dlg-btns button { flex: 1; height: 46px; border-radius: 14px; font-size: .9rem; font-weight: 800; }
    .dlg-btns .no { background: var(--soft); color: var(--navy); }
    .dlg-btns .yes { background: var(--wine); color: #fff; }

    .toast { position: fixed; left: 50%; bottom: 86px; transform: translate(-50%, 16px); background: var(--navy); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: .82rem; font-weight: 700; max-width: calc(100vw - 24px); text-align: center; opacity: 0; pointer-events: none; transition: all .3s; z-index: 95; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 520px) {
      .top-inner { gap: 2px; padding: 8px 10px; }
      .link-btn { padding: 6px 7px; font-size: .76rem; }
      .mark { width: 24px; height: 24px; }
      .thumb { width: 72px; }
      .item { gap: 10px; }
      .num { display: none; }
      .icon { width: 30px; height: 30px; }
      .overlay { padding: 0; }
      .editor { border-radius: 0; min-height: 100%; display: flex; flex-direction: column; }
      .ed-body { flex: 1; padding: 16px; }
      .ed-foot { position: sticky; bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .section-head { align-items: flex-start; }
      .bottom-inner .btn { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#fff" stroke="#0d1026" stroke-width="2.6"/><g transform="rotate(24 20 20)"><polygon points="20,6 24,20 16,20" fill="#9D3645"/><polygon points="20,34 24,20 16,20" fill="#0d1026"/></g><circle cx="20" cy="20" r="2.4" fill="#fff" stroke="#0d1026" stroke-width="1.6"/></symbol>
  </svg>

  <!-- 잠금 화면 -->
  <section class="lock" id="lockView">
    <form class="lock-card" id="lockForm">
      <svg class="mark"><use href="#mk"/></svg>
      <small>LOST MERIDIAN</small>
      <h1>관리자 페이지</h1>
      <p>비밀번호를 입력해 주세요</p>
      <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" />
      <div class="lock-err" id="pwErr"></div>
      <button class="btn btn-main" style="width:100%;height:48px;margin-top:6px" type="submit">들어가기</button>
    </form>
  </section>

  <!-- 관리 화면 -->
  <div id="appView" class="hidden">
    <header class="top">
      <div class="top-inner">
        <svg class="mark"><use href="#mk"/></svg>
        <h1><small>LOST MERIDIAN</small><b>관리자 페이지</b></h1>
        <a class="link-btn" href="./" target="_blank" rel="noopener">사이트 보기 ↗</a>
        <button class="link-btn" id="connBtn"><span class="dot" id="connDot"></span>연결</button>
        <button class="link-btn" id="lockBtn">잠그기</button>
      </div>
    </header>

    <div class="wrap">
      <div class="notice-bar hidden" id="connNote"><span>아직 GitHub이 연결되지 않았어요. 연결해야 사이트에 올릴 수 있어요.</span><button class="btn btn-main btn-sm" data-open-conn>연결하기</button></div>

      <nav class="tabs">
        <button class="tab active" data-tab="banners">홈 배너</button>
        <button class="tab" data-tab="news">소식</button>
      </nav>

      <section id="tab-banners">
        <div class="section-head">
          <div><h2>홈 배너</h2><div class="hint">위에 있을수록 먼저 보여요 · 6초마다 다음 배너로 넘어가요</div></div>
          <button class="btn btn-main" id="newBanner">+ 새 배너</button>
        </div>
        <div class="list" id="bannerList"></div>
      </section>

      <section id="tab-news" class="hidden">
        <div class="section-head">
          <div><h2>소식</h2><div class="hint">홈에는 최근 6개가 보여요 · 날짜 순으로 자동 정렬돼요</div></div>
          <button class="btn btn-main" id="newNews">+ 새 소식</button>
        </div>
        <div class="list" id="newsList"></div>
      </section>
    </div>

    <div class="bottom">
      <div class="bottom-inner">
        <div class="status" id="status"></div>
        <button class="btn btn-main" id="publishBtn">사이트에 올리기</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"><div class="editor" id="editor"></div></div>
  <div class="toast" id="toast"></div>

  <script>
    /* 비밀번호: 비밀번호 자체가 아니라 SHA-256 해시 값만 들어 있어요. 바꾸려면 Claude에게 말해 주세요. */
    const PASSWORD_HASH = "49c08d224066b8c26802fc975c96c7b663ddf7aee62d235114a62b0c69a865a8";
    const TOKEN_URL = "https://github.com/settings/personal-access-tokens/new";
    const CATS = ["공지", "업데이트", "이벤트", "점검", "제작 노트"];
    const TAG = { "공지": "t0", "업데이트": "t1", "이벤트": "t2", "점검": "t3", "제작 노트": "t4" };
    const FIELDS = ["img", "nick", "name", "link"];
    const LINKS = [["#home", "홈"], ["#adventurers", "모험가"], ["#guild", "길드"], ["#world", "세계관"], ["#world/story", "세계관 · 스토리"], ["#world/cities", "세계관 · 시작 도시"], ["#world/field", "세계관 · 필드"], ["#guide", "게임 가이드"], ["#guide/raid", "게임 가이드 · 레이드"], ["#guide/gear", "게임 가이드 · 장비·보석"], ["#guide/tower", "게임 가이드 · 첨탑"], ["#guide/pvp", "게임 가이드 · PvP"], ["#guide/server", "게임 가이드 · 서버"], ["#guide/trade", "게임 가이드 · 거래·귀속"], ["#guide/wardrobe", "게임 가이드 · 외형"], ["#news", "소식"], ["#play", "플레이 안내"]];

    /* ---------- 도구 ---------- */
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const clone = o => JSON.parse(JSON.stringify(o));
    const pad = n => String(n).padStart(2, "0");
    const today = () => { const d = new Date(); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };
    function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600); }
    async function sha256(text) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
    const I = {
      up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`,
      down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
      edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>`,
      del: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,

    /* ---------- GitHub ---------- */
    const gh = () => { try { return JSON.parse(localStorage.getItem("lm_gh") || "null"); } catch { return null; } };
    const ghSet = v => { try { v ? localStorage.setItem("lm_gh", JSON.stringify(v)) : localStorage.removeItem("lm_gh"); } catch {} };
    const connected = () => { const g = gh(); return !!(g && g.token); };
    function ghGuess() { const m = location.hostname.match(/^([^.]+)\.github\.io$/); return m ? { o: m[1], r: m[1] + ".github.io" } : { o: "lost-meridian", r: "lost-meridian.github.io" }; }
    const api = (g, path) => `https://api.github.com/repos/${encodeURIComponent(g.o)}/${encodeURIComponent(g.r)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
    const hdr = g => ({ Authorization: "Bearer " + g.token, Accept: "application/vnd.github+json" });
    function bytesB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

    async function ghRead(path) {

      if (r.status === 409 && !retry) return ghPut(path, b64, message, true);
      const x = await r.json().catch(() => ({}));
      throw new Error(r.status === 401 ? "토큰이 맞지 않거나 기간이 끝났어요" : (r.status === 403 || r.status === 404) ? "토큰에 이 저장소 쓰기 권한이 없어요" : (x.message || "올리기 실패 (" + r.status + ")"));
    }
    // 방금 올린 사진이 아직 사이트에 반영 전이면 GitHub 원본에서 보여줘요
    window.rawFallback = img => { const p = img.getAttribute("src"); if (img.dataset.raw || /^(blob:|data:|https?:)/.test(p)) return; const g = gh() || {}, q = ghGuess(); img.dataset.raw = 1; img.src = `https://raw.githubusercontent.com/${g.o || q.o}/${g.r || q.r}/${g.b || "main"}/${p}`; };

    /* ---------- 데이터 ---------- */
    let uidN = 0;
    const S = { banners: [], bBase: "[]", news: [], nBase: "[]", files: {}, prev: {}, busy: false };
    const clean = list => list.map(b => { const o = {}; if (b.nick == null && b.title != null) b.nick = b.title; FIELDS.forEach(k => o[k] = String(b[k] ?? "")); return o; });
    const sortN = a => a.sort((x, y) => x.d < y.d ? 1 : x.d > y.d ? -1 : 0);
    async function getJSON(path) {
      if (connected()) { try { const j = await ghRead(path); return j ? JSON.parse(b64Text(j.content)) : null; } catch {} }
      try { const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" }); return r.ok ? r.json() : null; } catch { return null; }
    }
    async function load() {

    }
    function diffCount(cur, base) { const A = cur.map(x => JSON.stringify(x)), B = base.map(x => JSON.stringify(x)), sB = new Set(B), sA = new Set(A); let n = A.filter(x => !sB.has(x)).length + B.filter(x => !sA.has(x)).length; if (!n && A.join() !== B.join()) n = 1; return n; }
    const bChanges = () => diffCount(clean(S.banners), JSON.parse(S.bBase)) + Object.keys(S.files).length;

    /* 사진 정리: 다시 그려서 EXIF(촬영 정보·위치) 삭제, 가로 1920px 넘으면 줄이기 */
    const MAX_W = 1920, MAX_H = 1920;

      catch {

      if (!png) { x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); }

      const blob = await new Promise(ok => c.toBlob(ok, type, .9));

    /* ---------- GitHub 연결 ---------- */
    function openConn(msg) {

          <div class="step"><b>1</b><span>아래 버튼을 눌러 GitHub 토큰 만들기 화면을 열어요.</span></div>
          <div class="step"><b>2</b><span>이름을 아무거나 적고, <em>Repository access</em>에서 <em>Only select repositories</em>를 골라 <em>${esc(g.r || q.r)}</em>를 선택해요.</span></div>
          <div class="step"><b>3</b><span><em>Permissions</em>에서 <em>Contents</em>를 <em>Read and write</em>로 바꾸고 맨 아래 <em>Generate token</em>을 눌러요.</span></div>
          <div class="step"><b>4</b><span>나온 토큰(github_pat_로 시작해요)을 복사해서 아래 칸에 붙여 넣어요.</span></div>
        </div>
        <a class="go-link" href="${TOKEN_URL}" target="_blank" rel="noopener">토큰 만들러 가기 ↗</a>
        <label class="f">토큰 <small>이 브라우저에만 저장돼요</small><input type="password" id="g_token" autocomplete="off" placeholder="${g.token ? "저장되어 있어요 (바꾸려면 새로 붙여 넣기)" : "github_pat_…"}" /></label>
        <details class="more"><summary>저장소 정보<small>보통은 안 바꿔도 돼요</small></summary><div class="in">
          <div class="row"><label class="f">사용자 이름<input type="text" id="g_o" value="${esc(g.o || q.o)}" /></label><label class="f">브랜치<input type="text" id="g_b" value="${esc(g.b || "main")}" /></label></div>
          <label class="f">저장소<input type="text" id="g_r" value="${esc(g.r || q.r)}" /></label>
        </div></details>`,
        `${g.token ? `<button class="btn btn-ghost" id="gOff">연결 끊기</button>` : `<button class="btn btn-ghost" id="gCancel">닫기</button>`}<button class="btn btn-main" id="gSave">연결 저장</button>`);
      if ($("gCancel")) $("gCancel").onclick = closeEditor;
      if ($("gOff")) $("gOff").onclick = async () => { if (!(await confirmBox("GitHub 연결을 끊을까요?\n다시 연결하려면 토큰을 새로 붙여 넣어야 해요", "끊기"))) return; ghSet(null); closeEditor(); renderStatus(); toast("연결을 끊었어요"); };
      $("gSave").onclick = async () => {
        const old = gh() || {};
        const v = { o: $("g_o").value.trim(), r: $("g_r").value.trim(), b: $("g_b").value.trim() || "main", p: old.p || "news.json", token: $("g_token").value.trim() || old.token || "" };
        if (!v.o || !v.r || !v.token) return toast("토큰을 붙여 넣어 주세요");
        $("gSave").disabled = true; $("gSave").textContent = "확인하는 중…";
        try {
          const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(v.o)}/${encodeURIComponent(v.r)}`, { headers: hdr(v) });
          if (r.status === 401) throw "토큰이 맞지 않아요. 다시 복사해 주세요";
          if (!r.ok) throw "저장소를 찾지 못했어요. 토큰에 이 저장소를 골랐는지 확인해 주세요";
          const j = await r.json();
          if (j.permissions && j.permissions.push === false) throw "토큰에 쓰기 권한이 없어요. Contents를 Read and write로 바꿔 주세요";
          ghSet(v); closeEditor(); renderStatus(); toast("연결했어요! 이제 사이트에 올릴 수 있어요");
          if (!(bChanges() + nChanges())) load();
        } catch (err) { toast(typeof err === "string" ? err : "연결하지 못했어요. 잠시 뒤 다시 해 주세요"); $("gSave").disabled = false; $("gSave").textContent = "연결 저장"; }
      };
    }
    $("connBtn").onclick = () => openConn();

    /* ---------- 사이트에 올리기 ---------- */
    const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
    const fileB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(f); });
    $("publishBtn").onclick = async () => {
      if (!connected()) return openConn("사이트에 올리려면 먼저 GitHub을 연결해 주세요.");
      const bN = bChanges(), nN = nChanges(); if (!bN && !nN) return;
      S.busy = true; renderStatus();
      const say = t => $("status").textContent = t;
      try {
        if (bN) {
          const st = stamp(), pend = S.banners.filter(b => S.files[b._id]);
          for (let k = 0; k < pend.length; k++) {
            const b = pend[k], f = S.files[b._id], ext = ((f.name.match(/\.([a-z0-9]+)$/i) || [])[1] || "jpg").toLowerCase();
            const path = `images/banners/${st}-${S.banners.indexOf(b) + 1}.${ext}`;
            say(`사진 올리는 중 (${k + 1}/${pend.length})…`);
            await ghPut(path, await fileB64(f), "배너 사진: " + (b.nick || path));
            b.img = path; delete S.files[b._id];
          }
          say("배너 올리는 중…");
          const out = clean(S.banners);
          await ghPut("banners.json", textB64(JSON.stringify(out, null, 1) + "\n"), "배너 수정");
          S.bBase = JSON.stringify(out);
        }
        if (nN) {
          say("소식 올리는 중…");
          const out = sortN(clone(S.news));
          await ghPut("news.json", textB64("[\n" + out.map(n => "  " + JSON.stringify(n)).join(",\n") + "\n]\n"), "소식 수정");
          S.nBase = JSON.stringify(S.news);
        }
        S.busy = false; renderAll(); toast("사이트에 올렸어요! 1~2분 뒤에 보여요");
      } catch (err) { S.busy = false; renderAll(); toast("올리지 못했어요: " + err.message); }
    };
    addEventListener("beforeunload", e => { if (!$("appView").classList.contains("hidden") && bChanges() + nChanges()) { e.preventDefault(); e.returnValue = ""; } });

    /* ---------- 잠금 ---------- */
    function unlock() { $("lockView").classList.add("hidden"); $("appView").classList.remove("hidden"); try { sessionStorage.setItem("lm_admin_ok", PASSWORD_HASH); } catch {} renderStatus(); load(); }
    $("lockForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (!window.crypto || !crypto.subtle) { $("pwErr").textContent = "이 주소에서는 열 수 없어요. https:// 사이트 주소로 열어 주세요."; return; }
      if (await sha256($("pw").value) === PASSWORD_HASH) unlock();
      else { $("pwErr").textContent = "비밀번호가 달라요"; $("pw").select(); }
    });
    $("lockBtn").onclick = async () => {
      if (bChanges() + nChanges() && !(await confirmBox("아직 안 올린 변경이 있어요\n잠그면 이 변경은 사라져요", "잠그기"))) return;
      try { sessionStorage.removeItem("lm_admin_ok"); } catch {}
      S.banners = []; S.news = []; S.files = {}; S.bBase = S.nBase = "[]"; location.reload();
    };
    try { if (sessionStorage.getItem("lm_admin_ok") === PASSWORD_HASH) unlock(); else $("pw").focus(); } catch { $("pw").focus(); }
  </script>
</body>
</html>
